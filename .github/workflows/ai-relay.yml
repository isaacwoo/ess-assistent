name: AI Relay

on:
  repository_dispatch:
    types: [ai-relay]

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Read request from Gist
        id: read
        env:
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
          GIST_ID: ${{ github.event.client_payload.gist_id }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          set -e
          echo "Reading gist $GIST_ID (request $REQUEST_ID)..."

          gist_json=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID")

          content=$(echo "$gist_json" | jq -r '.files["relay.json"].content')
          if [ -z "$content" ] || [ "$content" = "null" ]; then
            echo "::error::relay.json content empty"
            exit 1
          fi

          echo "$content" > request.json

          gist_req_id=$(jq -r '.request_id' request.json)
          if [ "$gist_req_id" != "$REQUEST_ID" ]; then
            echo "::warning::request_id mismatch: gist=$gist_req_id dispatch=$REQUEST_ID"
          fi

          provider_type=$(jq -r '.provider_type // "openai"' request.json)
          model=$(jq -r '.model' request.json)
          echo "provider_type=$provider_type  model=$model"

          echo "provider_type=$provider_type" >> "$GITHUB_OUTPUT"
          echo "model=$model"                 >> "$GITHUB_OUTPUT"

      - name: Call AI API
        id: call
        env:
          PROVIDER_TYPE: ${{ steps.read.outputs.provider_type }}
          MODEL: ${{ steps.read.outputs.model }}
        run: |
          set -e

          # Read credentials from payload (set by user in ESS settings modal)
          api_key=$(jq -r '.api_key  // ""' request.json)
          api_base=$(jq -r '.api_base // ""' request.json)

          if [ -z "$api_key" ]; then
            echo "error:APIキーが未設定です。設定モーダルでAPIキーを保存してください。" > error.txt
            exit 0
          fi

          # Check image attachment
          has_image=$(jq -r 'if .image and .image.data then "true" else "false" end' request.json)

          # ── Helper: build OpenAI-compatible request body ───────────────────
          build_openai_body() {
            local out=$1
            jq --arg model "$MODEL" '{
              model: $model,
              messages: [.messages[] | { role: .role, content: .content }]
            }' request.json > _tmp.json

            if [ "$has_image" = "true" ]; then
              jq -r '.image.data' request.json > _img.txt
              img_mime=$(jq -r '.image.mimeType // "image/jpeg"' request.json)
              jq --rawfile imgdata _img.txt --arg mime "$img_mime" \
              '.messages[-1].content = [
                {"type":"text","text":.messages[-1].content},
                {"type":"image_url","image_url":{"url":("data:"+$mime+";base64,"+($imgdata|rtrimstr("\n")))}}
              ]' _tmp.json > "$out"
            else
              mv _tmp.json "$out"
            fi
          }
          # ──────────────────────────────────────────────────────────────────

          case "$PROVIDER_TYPE" in

            # ── Gemini ───────────────────────────────────────────────────────
            gemini)
              jq '{
                contents: [.messages[] | {
                  role: (if .role == "assistant" then "model" else "user" end),
                  parts: [{ text: .content }]
                }]
              }' request.json > _gemini_base.json

              if [ "$has_image" = "true" ]; then
                jq -r '.image.data' request.json > _img.txt
                img_mime=$(jq -r '.image.mimeType // "image/jpeg"' request.json)
                jq --rawfile imgdata _img.txt --arg mime "$img_mime" \
                '.contents[-1].parts += [{"inline_data":{"mime_type":$mime,"data":($imgdata|rtrimstr("\n"))}}]' \
                _gemini_base.json > _gemini_body.json
              else
                mv _gemini_base.json _gemini_body.json
              fi

              http_code=$(curl -sS -o resp.json -w "%{http_code}" \
                -X POST -H "Content-Type: application/json" \
                "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${api_key}" \
                --data @_gemini_body.json)

              if [ "$http_code" != "200" ]; then
                err=$(jq -r '.error.message // "Gemini API error"' resp.json 2>/dev/null || echo "HTTP $http_code")
                echo "error:Gemini API (HTTP $http_code): $err" > error.txt
                exit 0
              fi

              reply=$(jq -r '.candidates[0].content.parts[0].text // empty' resp.json)
              ;;

            # ── Generic OpenAI-compatible (Groq, OpenAI, DeepSeek, Kimi, etc.)
            openai|*)
              if [ -z "$api_base" ]; then
                echo "error:APIエンドポイントが未設定です" > error.txt
                exit 0
              fi

              build_openai_body _body.json

              http_code=$(curl -sS -o resp.json -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer ${api_key}" \
                -H "Content-Type: application/json" \
                "${api_base}/chat/completions" \
                --data @_body.json)

              if [ "$http_code" != "200" ]; then
                err=$(jq -r '.error.message // "API error"' resp.json 2>/dev/null || echo "HTTP $http_code")
                echo "error:API (HTTP $http_code): $err" > error.txt
                exit 0
              fi

              reply=$(jq -r '.choices[0].message.content // empty' resp.json)
              ;;
          esac

          if [ -z "$reply" ]; then
            echo "error:AIが空のレスポンスを返しました" > error.txt
          else
            printf '%s' "$reply" > reply.txt
          fi

      - name: Write response to Gist
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELAY_PAT }}
          GIST_ID: ${{ github.event.client_payload.gist_id }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          set -e

          if [ -f error.txt ]; then
            err_msg=$(cat error.txt | sed 's/^error://')
            jq -n \
              --arg rid "$REQUEST_ID" --arg err "$err_msg" \
              --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{ status:"error", request_id:$rid, error:$err, completed_at:$now }' > result.json
          elif [ -f reply.txt ]; then
            jq -n \
              --rawfile reply reply.txt \
              --arg rid "$REQUEST_ID" \
              --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{ status:"completed", request_id:$rid, response:$reply, completed_at:$now }' > result.json
          else
            jq -n \
              --arg rid "$REQUEST_ID" \
              --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{ status:"error", request_id:$rid, error:"Workflow produced no output", completed_at:$now }' > result.json
          fi

          jq -n --rawfile content result.json \
            '{ files: { "relay.json": { content: $content } } }' > patch.json

          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/$GIST_ID" \
            --data @patch.json > /dev/null

          echo "Gist updated."
