<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESS ASSISTENT</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="lib/highlight-default.min.css">
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">ESS ASSISTENT</span>
      <button id="sidebar-close-btn" class="icon-btn" title="サイドバーを閉じる">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="sidebar-actions">
      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        新しいチャット
      </button>
    </div>
    <div id="session-list" class="session-list">
      <!-- Sessions rendered by storage.js -->
    </div>
  </aside>

  <!-- Main area -->
  <main id="main-area" class="main-area">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebar-open-btn" class="icon-btn sidebar-toggle-btn" title="サイドバーを開く" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <select id="model-select" class="model-select">
          <option value="">モデルを読み込み中...</option>
        </select>
      </div>
      <div class="topbar-right">
        <button id="settings-btn" class="icon-btn" title="設定">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" title="テーマ切り替え">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <!-- Content row: chat + preview side by side -->
    <div class="content-row">
    <!-- Chat container -->
    <div class="chat-wrapper">
      <div id="chat-container" class="chat-container">
        <!-- Welcome screen -->
        <div id="welcome-screen" class="welcome-screen">
          <div class="welcome-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <h1 class="welcome-title">ESS ASSISTENT</h1>
          <p class="welcome-subtitle">ローカルAIアシスタント — 何でもお気軽にどうぞ</p>
        </div>
        <!-- Messages rendered here by chat.js -->
      </div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-divider"></div>
        <!-- Image preview (shown when image is attached) -->
        <div id="image-preview-area" class="image-preview-area" style="display:none;">
          <div class="image-preview-inner">
            <img id="image-preview-thumb" class="image-preview-thumb" alt="">
            <button id="image-remove-btn" class="image-remove-btn" title="画像を削除">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="input-wrapper">
          <input type="file" id="image-input" accept="image/*" style="display:none">
          <button id="image-btn" class="icon-btn image-attach-btn" title="画像を添付">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <textarea id="user-input" class="user-input" placeholder="メッセージを入力..." rows="1"></textarea>
          <button id="send-btn" class="send-btn" title="送信 (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </button>
          <button id="stop-btn" class="stop-btn" title="生成を停止" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
        <div class="input-hint">Enter で送信 &nbsp;·&nbsp; Alt+Enter または Shift+Enter で改行</div>
      </div>
    </div><!-- end chat-wrapper -->

    <!-- Preview panel (right side) -->
    <aside id="preview-panel" class="preview-panel" style="display:none;">
      <div class="preview-header">
        <span>プレビュー</span>
        <button id="preview-close-btn" class="icon-btn" title="閉じる">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <iframe id="preview-iframe" class="preview-iframe" sandbox="allow-scripts"></iframe>
    </aside>
    </div><!-- end content-row -->
  </main>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content settings-modal-wide">
      <div class="modal-header">
        <h3>設定</h3>
        <button id="settings-close-btn" class="icon-btn" title="閉じる">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">

        <!-- GitHub PAT section -->
        <div class="settings-section">
          <div class="settings-section-title">GitHub PAT（中継必須）</div>
          <p class="modal-hint">外部AIリレーに必要です。スコープ: <code>repo</code> + <code>gist</code> + <code>workflow</code></p>
          <input id="settings-pat-input" type="password" class="modal-input" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
          <div class="modal-actions">
            <button id="settings-test-btn"  class="modal-btn modal-btn-secondary">テスト</button>
            <button id="settings-save-btn"  class="modal-btn modal-btn-primary">保存</button>
            <button id="settings-clear-btn" class="modal-btn modal-btn-danger">削除</button>
          </div>
          <div id="settings-pat-status" class="settings-status"></div>
        </div>

        <!-- AI Providers section -->
        <div class="settings-section">
          <div class="settings-section-title">外部AIプロバイダー</div>
          <p class="modal-hint">APIキーを保存するとモデル選択に表示されます。削除すると非表示になります。</p>
          <div id="settings-provider-list"></div>
          <button id="settings-add-btn" class="modal-btn settings-add-btn">＋ カスタムプロバイダーを追加</button>
          <div id="settings-custom-form" style="display:none;"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/relay.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
